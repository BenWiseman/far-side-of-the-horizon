  <text x="28" y="314" font-size="12.5" text-anchor="start" fill="#111111" font-weight="normal">2025 set: N = 3, 4, 5, 6, 7 gives ΩK = −0.076, −0.039, −0.024, −0.016, −0.012.</text>
  <text x="28" y="336" font-size="12.5" text-anchor="start" fill="#111111" font-weight="normal">Nearest allowed value: N = 7, ΩK = −0.012, 13.0σ from DESI DR2 + CMB, but 0.2σ from Planck alone.</text>
  <text x="28" y="358" font-size="12.5" text-anchor="start" fill="#111111" font-weight="normal">The 2025 χ² minimum N = 4 is 37.5σ from DESI DR2 + CMB and is exactly the value the elliptic reading forbids.</text>
  <text x="28" y="393" font-size="12.5" text-anchor="start" fill="#535353" font-weight="normal">No compact reading admits positive ΩK. Exact flatness is 2.09σ from DESI DR2 + CMB.</text>
