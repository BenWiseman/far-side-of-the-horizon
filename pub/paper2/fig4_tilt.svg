  <text x="498.0" y="359.0" font-size="12.5" text-anchor="start" fill="#111111" font-weight="bold">0.9726 ± 0.0028</text>
  <text x="678.0" y="359.0" font-size="12.5" text-anchor="end" fill="#111111" font-weight="bold">+5.25σ</text>
  <text x="355" y="416" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">scalar spectral index nₛ</text>
  <text x="28" y="442" font-size="12.5" text-anchor="start" fill="#111111" font-weight="normal">Prediction: nₛ = 1 − 7α₃(Mₚ)/π = 0.957888. Amplitude at N₀ = 36 with Standard-Model couplings demands nₛ = 0.9498.</text>
  <text x="28" y="465" font-size="12.5" text-anchor="start" fill="#535353" font-weight="normal">The two values are not on the same one-parameter locus. This is posterior tension with the mechanism,</text>
  <text x="28" y="483" font-size="12.5" text-anchor="start" fill="#535353" font-weight="normal">not a formal exclusion.</text>
  <text x="28" y="510" font-size="12.5" text-anchor="start" fill="#535353" font-weight="normal">The CPT-symmetric structure fixes no tilt. Freeing Nₑff removes the tension, but needs ΔNₑff ≈ −0.35 to −0.82.</text>
</svg>
